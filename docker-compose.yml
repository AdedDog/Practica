# Деплой: docker compose up -d --build
# Перед первым запуском: cp env.docker.example backend/.env и задайте SECRET_KEY

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: practica-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./data/app.db
    volumes:
      - backend-data:/app/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: practica-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
